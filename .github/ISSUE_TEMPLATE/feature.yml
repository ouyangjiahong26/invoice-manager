name: 功能建议
description: 新功能或对现有功能的改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        分诊流程与标签映射见 `docs/agents/triage-labels.md`。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在有什么不方便或做不到的事？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 希望做成什么样？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 考虑过的其他做法（可选）
